services:

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASSWORD}
      - SERVER_REGIONS=Netherlands
      - TZ=Asia/Kolkata
      - DNS_ADDRESS=1.1.1.1
      - HTTP_CONTROL_SERVER_PORT=8181
      - HEALTH_SERVER_ADDRESS=:9998
      - FIREWALL_INPUT_PORTS=8090,9696
    volumes:
      - /mnt/flash/appdata/gluetun:/gluetun
    ports:
      - 8090:8090
      - 8181:8181
      - 9696:9696
      - 6881:6881
      - 6881:6881/udp
    networks:
      - arr-network

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8090
    volumes:
      - /mnt/flash/appdata/qbittorrent:/config
      - /mnt/flash/downloads:/downloads

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/prowlarr:/config

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/radarr:/config
      - /mnt/vault/media/movies:/movies
      - /mnt/flash/downloads:/downloads
    ports:
      - 7878:7878
    networks:
      - arr-network

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/sonarr:/config
      - /mnt/vault/media/tv:/tv
      - /mnt/vault/media/adult:/adult
      - /mnt/flash/downloads:/downloads
    ports:
      - 8989:8989
    networks:
      - arr-network

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/lidarr:/config
      - /mnt/vault/media/music:/music
      - /mnt/flash/downloads:/downloads
    ports:
      - 8686:8686
    networks:
      - arr-network

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/bazarr:/config
      - /mnt/vault/media/movies:/movies
      - /mnt/vault/media/tv:/tv
    ports:
      - 6767:6767
    networks:
      - arr-network

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video, compute, utility]
    volumes:
      - /mnt/flash/appdata/jellyfin/config:/config
      - /mnt/flash/appdata/jellyfin/cache:/cache
      - /mnt/vault/media:/media
    ports:
      - 8096:8096
    networks:
      - arr-network

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/jellyseerr:/app/config
    ports:
      - 5055:5055
    networks:
      - arr-network

networks:
  arr-network:
    name: arr-network