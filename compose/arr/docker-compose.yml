services:

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASSWORD}
      - TZ=Asia/Kolkata
      - DNS_ADDRESS=1.1.1.1
      - HTTP_CONTROL_SERVER_ADDRESS=:8181
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=private internet access
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh /portforward.sh
      - PORT_FORWARD_ONLY=true
      # Singapore pool works for PIA port forwarding; the Amsterdam pool does not
      # (its PF API cert names a different server than gluetun expects).
      - SERVER_NAMES=Server-10878-2a
      - HEALTH_SERVER_ADDRESS=:9998
      - FIREWALL_INPUT_PORTS=8090,9696,8191   # 8191 = FlareSolverr, reached by Prowlarr on localhost
    volumes:
      - /mnt/flash/appdata/gluetun:/gluetun
      - /mnt/flash/appdata/gluetun/portforward.sh:/portforward.sh:ro
    ports:
      - 8090:8090
      - 8181:8181
      - 9696:9696
      - 6881:6881
      - 6881:6881/udp
    networks:
      - arr-network

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8090
    volumes:
      - /mnt/flash/appdata/qbittorrent:/config
      - /mnt/vault/data/torrents:/downloads

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/prowlarr:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    # Shares gluetun's network namespace so ALL of its browser traffic exits through
    # the PIA tunnel. FlareSolverr fetches torrent indexer sites to solve Cloudflare
    # challenges, so leaving it on arr-network would send that traffic from Usnik's
    # real home IP - strictly worse than not having it. Prowlarr sits in the same
    # namespace and reaches it at http://localhost:8191/ (no published port, so
    # nothing new is exposed on the host or the LAN).
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Kolkata
      - CAPTCHA_SOLVER=none

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/radarr:/config
      - /mnt/vault/data:/data
    ports:
      - 7878:7878
    networks:
      - arr-network

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/sonarr:/config
      - /mnt/vault/data:/data
    ports:
      - 8989:8989
    networks:
      - arr-network

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/lidarr:/config
      - /mnt/vault/data:/data
    ports:
      - 8686:8686
    networks:
      - arr-network

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/bazarr:/config
      - /mnt/vault/data:/data
    ports:
      - 6767:6767
    networks:
      - arr-network

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video, compute, utility]
    volumes:
      - /mnt/flash/appdata/jellyfin/config:/config
      - /mnt/flash/appdata/jellyfin/cache:/cache
      - /mnt/vault/data/media:/media
    ports:
      - 8096:8096
    networks:
      - arr-network

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/jellyseerr:/app/config
    ports:
      - 5055:5055
    networks:
      - arr-network

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: "no"
    user: "0:0"
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - /mnt/flash/appdata/recyclarr:/config
    networks:
      - arr-network

networks:
  arr-network:
    name: arr-network
