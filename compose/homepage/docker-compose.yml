services:
  homepage:
    image: nginx:alpine
    container_name: homepage
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/flash/appdata/homepage/index.html:/usr/share/nginx/html/index.html:ro
      - /mnt/flash/appdata/homepage/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/flash/appdata/homepage/ssl:/etc/nginx/ssl:ro
      - /mnt/flash/projects/usnikb.github.io:/usr/share/nginx/html/portfolio:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - homepage_homepage-net
      - arr-network

networks:
  homepage_homepage-net:
    external: true
  arr-network:
    external: true
