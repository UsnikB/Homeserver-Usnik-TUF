server {
    listen 80;
    server_name oarchtuf.tail25be85.ts.net oarchtuf localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name oarchtuf.tail25be85.ts.net oarchtuf localhost;

    ssl_certificate /etc/nginx/ssl/master.crt;
    ssl_certificate_key /etc/nginx/ssl/master.key;

    # Docker's internal DNS — re-resolve upstreams every 30s instead of caching at startup
    resolver 127.0.0.11 valid=30s;

    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Ssl on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /portfolio/ {
        alias /usr/share/nginx/html/portfolio/;
        index index.html;
    }

    # KEEP PREFIX - Jellyfin has BaseUrl=/jellyfin set in network.xml
    location /jellyfin/ {
        set $upstream http://jellyfin:8096;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /qbittorrent/ {
        proxy_pass http://gluetun:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect / /qbittorrent/;
    }

    # Jellyseerr - no subpath support in this build; redirect to direct port
    location /jellyseerr/ {
        return 302 http://$host:5055/;
    }

    # Arrs (subpath-safe, keep prefix)
    location /radarr/ {
        set $upstream http://radarr:7878;
        proxy_pass $upstream;
    }
    location /sonarr/ {
        set $upstream http://sonarr:8989;
        proxy_pass $upstream;
    }
    location /lidarr/ {
        set $upstream http://lidarr:8686;
        proxy_pass $upstream;
    }
    location /prowlarr/ {
        set $upstream http://gluetun:9696;
        proxy_pass $upstream;
    }
    location /bazarr/ {
        set $upstream http://bazarr:6767;
        proxy_pass $upstream;
    }

    # System
    location /portainer/ {
        set $upstream http://portainer:9000;
        rewrite ^/portainer/(.*) /$1 break;
        proxy_pass $upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Canonical Redirects (Ensure trailing slashes)
    location /jellyfin    { return 301 $scheme://$http_host/jellyfin/; }
    location = /jellyseerr { return 302 http://$host:5055/; }
    location /qbittorrent { return 301 $scheme://$http_host/qbittorrent/; }
    location /radarr      { return 301 $scheme://$http_host/radarr/; }
    location /sonarr      { return 301 $scheme://$http_host/sonarr/; }
    location /lidarr      { return 301 $scheme://$http_host/lidarr/; }
    location /prowlarr    { return 301 $scheme://$http_host/prowlarr/; }
    location /bazarr      { return 301 $scheme://$http_host/bazarr/; }
    location /portainer   { return 301 $scheme://$http_host/portainer/; }

    # Stats (IPs are stable — no DNS needed)
    location /stats/disks { proxy_pass http://172.17.0.1:61209/; }
    location /stats/gpu   { proxy_pass http://172.17.0.1:61209/gpu; }
    location /stats/      { proxy_pass http://172.17.0.1:61208/api/4/; }
}
